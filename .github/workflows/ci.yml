name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python syntax
        run: python3 -m compileall -q scripts .claude/hooks tests
      - name: Shell syntax
        run: |
          bash -n scripts/sync.sh
          bash -n scripts/install_tools.sh
          bash -n scripts/token_report.sh
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Skill drift
        run: python3 scripts/leanloop/sync.py --check
      - name: LeanLoop doctor
        run: python3 scripts/leanloop/doctor.py --strict
